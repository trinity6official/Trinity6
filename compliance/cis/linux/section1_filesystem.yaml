framework: CIS
version: "2.0"
section: "1"
title: "Initial Setup - Filesystem Configuration"
os: linux

controls:
  - id: CIS-1.1.1.1
    title: "Ensure cramfs filesystem is disabled"
    description: "Removing support for unneeded filesystem 
    types reduces the local attack surface."
    severity: Low
    scored: true
    frameworks:
      - CIS
      - NIST: CM-6
      - ISO27001: A.12.6.1
    check:
      type: command
      command: "modprobe -n -v cramfs 2>&1"
      operator: contains
      expected: "install /bin/true"
    remediation:
      description: "Disable cramfs filesystem module"
      commands:
        - "echo 'install cramfs /bin/true' >> /etc/modprobe.d/CIS.conf"
      verify: "modprobe -n -v cramfs"

