  - id: CIS-1.3.1
    title: "Ensure AIDE is installed"
    description: "AIDE takes a snapshot of filesystem state 
    including modification times, permissions, and file hashes 
    which can then be used to compare against the current state 
    of the filesystem to detect modifications."
    severity: Medium
    scored: true
    frameworks:
      - CIS
      - NIST: SI-7
      - ISO27001: A.12.2.1
      - SOC2: CC6.1
    check:
      type: command
      command: "dpkg -l aide 2>/dev/null | grep -c aide"
      operator: ">="
      expected: 1
      parse: last_value
    remediation:
      description: "Install AIDE"
      commands:
        - "apt install aide aide-common -y"
        - "aideinit"
      verify: "dpkg -l aide"

  - id: CIS-1.4.1
    title: "Ensure permissions on bootloader config are configured"
    description: "Setting the permissions to read and write 
    for root only prevents non-root users from seeing the boot 
    parameters or changing them."
    severity: High
    scored: true
    frameworks:
      - CIS
      - NIST: AC-3
      - ISO27001: A.9.4.1
    check:
      type: command
      command: "stat /boot/grub/grub.cfg | grep Access | head -1"
      operator: contains
      expected: "0600"
    remediation:
      description: "Set bootloader config permissions to 600"
      commands:
        - "chown root:root /boot/grub/grub.cfg"
        - "chmod og-rwx /boot/grub/grub.cfg"
      verify: "stat /boot/grub/grub.cfg"

  - id: CIS-1.5.1
    title: "Ensure core dumps are restricted"
    description: "A core dump is the memory of an executable 
    program. It is generally used to determine why a program 
    aborted. It can also be used to glean confidential 
    information from a core file."
    severity: Medium
    scored: true
    frameworks:
      - CIS
      - NIST: SC-4
      - ISO27001: A.12.6.1
    check:
      type: command
      command: "grep -E '^\\*\\s+hard\\s+core' /etc/security/limits.conf"
      operator: contains
      expected: "hard core 0"
    remediation:
      description: "Restrict core dumps"
      commands:
        - "echo '* hard core 0' >> /etc/security/limits.conf"
        - "echo 'fs.suid_dumpable = 0' >> /etc/sysctl.conf"
        - "sysctl -w fs.suid_dumpable=0"
      verify: "grep core /etc/security/limits.conf"

  - id: CIS-1.5.3
    title: "Ensure address space layout randomization is enabled"
    description: "Address space layout randomization protects 
    against certain types of buffer overflow attacks."
    severity: High
    scored: true
    frameworks:
      - CIS
      - NIST: SI-16
      - ISO27001: A.12.6.1
      - SOC2: CC6.1
    check:
      type: command
      command: "sysctl kernel.randomize_va_space"
      operator: contains
      expected: "= 2"
    remediation:
      description: "Enable ASLR"
      commands:
        - "echo 'kernel.randomize_va_space = 2' >> /etc/sysctl.conf"
        - "sysctl -w kernel.randomize_va_space=2"
      verify: "sysctl kernel.randomize_va_space"
