framework: CIS
version: "2.0"
section: "2"
title: "Services"
os: linux

controls:
  - id: CIS-2.1.1
    title: "Ensure xinetd is not installed"
    description: "The eXtended InterNET Daemon provides 
    access control for network services. It should not 
    be installed unless specifically required."
    severity: Medium
    scored: true
    frameworks:
      - CIS
      - NIST: CM-7
      - ISO27001: A.12.6.1
    check:
      type: command
      command: "dpkg -l xinetd 2>/dev/null | grep -c xinetd"
      operator: "=="
      expected: 0
      parse: last_value
    remediation:
      description: "Remove xinetd package"
      commands:
        - "apt purge xinetd -y"
      verify: "dpkg -l xinetd"

  - id: CIS-2.2.1
    title: "Ensure time synchronization is in use"
    description: "Time synchronization is important to 
    support time sensitive security mechanisms and to 
    ensure log files have consistent time records."
    severity: Medium
    scored: true
    frameworks:
      - CIS
      - NIST: AU-8
      - ISO27001: A.12.4.4
      - SOC2: CC7.1
    check:
      type: command
      command: "systemctl is-enabled systemd-timesyncd 2>/dev/null || systemctl is-enabled ntp 2>/dev/null || systemctl is-enabled chrony 2>/dev/null"
      operator: contains
      expected: "enabled"
    remediation:
      description: "Enable time synchronization"
      commands:
        - "apt install chrony -y"
        - "systemctl enable chrony"
        - "systemctl start chrony"
      verify: "systemctl is-enabled chrony"

  - id: CIS-2.2.2
    title: "Ensure X Window System is not installed"
    description: "The X Window System provides a Graphical 
    User Interface environment. Unless required, it should 
    not be installed on server systems."
    severity: Medium
    scored: true
    frameworks:
      - CIS
      - NIST: CM-7
      - ISO27001: A.12.6.1
    check:
      type: command
      command: "dpkg -l xserver-xorg* 2>/dev/null | grep -c xserver"
      operator: "=="
      expected: 0
      parse: last_value
    remediation:
      description: "Remove X Window System"
      commands:
        - "apt purge xserver-xorg* -y"
      verify: "dpkg -l xserver-xorg*"

  - id: CIS-2.2.3
    title: "Ensure Avahi Server is not enabled"
    description: "Avahi is a free zeroconf implementation 
    including a system for multicast DNS/DNS-SD discovery. 
    It should be disabled if not required."
    severity: Medium
    scored: true
    frameworks:
      - CIS
      - NIST: CM-7
      - ISO27001: A.12.6.1
    check:
      type: command
      command: "systemctl is-enabled avahi-daemon 2>/dev/null"
      operator: contains
      expected: "disabled"
    remediation:
      description: "Disable Avahi Server"
      commands:
        - "systemctl disable avahi-daemon"
        - "systemctl stop avahi-daemon"
      verify: "systemctl is-enabled avahi-daemon"

  - id: CIS-2.2.4
    title: "Ensure CUPS is not enabled"
    description: "The Common Unix Print System provides the 
    ability to print to local and network printers. Unless 
    printing is required it should be disabled."
    severity: Low
    scored: true
    frameworks:
      - CIS
      - NIST: CM-7
    check:
      type: command
      command: "systemctl is-enabled cups 2>/dev/null"
      operator: contains
      expected: "disabled"
    remediation:
      description: "Disable CUPS"
      commands:
        - "systemctl disable cups"
        - "systemctl stop cups"
      verify: "systemctl is-enabled cups"

  - id: CIS-2.2.5
    title: "Ensure DHCP Server is not enabled"
    description: "The Dynamic Host Configuration Protocol 
    is a service that allows machines to be dynamically 
    assigned IP addresses. Unless required it should be disabled."
    severity: High
    scored: true
    frameworks:
      - CIS
      - NIST: CM-7
